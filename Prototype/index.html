<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ars Electronica - Swipe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Smooth snapping for unswiped cards */
        .card-snap { transition: transform 0.3s ease-out; }
        /* Card flying off screen */
        .card-swipe-right { transform: translate(150vw, 0) rotate(30deg) !important; transition: transform 0.4s ease-out; }
        .card-swipe-left { transform: translate(-150vw, 0) rotate(-30deg) !important; transition: transform 0.4s ease-out; }
        
        /* Sleek scrollbar for the description */
        .desc-scroll::-webkit-scrollbar { width: 4px; }
        .desc-scroll::-webkit-scrollbar-track { background: transparent; }
        .desc-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen w-screen overflow-hidden flex flex-col font-sans">

    <!-- Screen 1: Start Session -->
    <div id="start-screen" class="flex-1 flex flex-col items-center justify-center p-6 z-20 absolute inset-0 bg-gray-900 transition-opacity duration-500">
        <h1 class="text-4xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-violet-500">Discover Ars</h1>
        <p class="mb-8 text-gray-400 text-center">What kind of experiences are you looking for?</p>
        <input type="text" id="interests-input" placeholder="e.g. ambient electronic performances" 
               class="w-full max-w-sm px-4 py-3 rounded-full bg-gray-800 border border-gray-700 focus:outline-none focus:border-pink-500 mb-6 shadow-inner text-white">
        <button onclick="startSession()" class="px-8 py-3 rounded-full bg-gradient-to-r from-pink-600 to-violet-600 font-bold hover:scale-105 transition-transform shadow-lg shadow-pink-500/30">
            Start Swiping
        </button>
    </div>

    <!-- Screen 2: Swipe Deck -->
    <div id="swipe-screen" class="flex-1 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500 absolute inset-0 pb-20">
        <div id="deck-container" class="relative w-80 h-[28rem]">
            <!-- Cards injected here via JS -->
        </div>
        
        <!-- Manual Buttons -->
        <div class="flex gap-8 mt-12 z-10">
            <button onclick="triggerManualSwipe('left')" class="w-16 h-16 rounded-full bg-gray-800 text-red-400 text-2xl font-bold border border-gray-700 shadow-xl hover:bg-gray-700 flex items-center justify-center transition-colors">✕</button>
            <button onclick="triggerManualSwipe('right')" class="w-16 h-16 rounded-full bg-gray-800 text-green-400 text-3xl pb-1 border border-gray-700 shadow-xl hover:bg-gray-700 flex items-center justify-center transition-colors">♥</button>
        </div>
    </div>

    <!-- Header Navigation (Hidden initially) -->
    <div id="nav-bar" class="absolute top-0 w-full p-6 flex justify-between items-center z-30 opacity-0 pointer-events-none transition-opacity">
        <button onclick="window.location.reload()" class="font-bold tracking-widest text-gray-400 hover:text-white">ARS</button>
        <button onclick="showSchedule()" class="text-pink-500 font-bold hover:text-pink-400">My Schedule</button>
    </div>

    <!-- Screen 3: Schedule/Likes -->
    <div id="schedule-screen" class="absolute inset-0 bg-gray-900 z-40 translate-y-full transition-transform duration-500 flex flex-col overflow-y-auto">
        <div class="p-6 flex justify-between items-center sticky top-0 bg-gray-900/90 backdrop-blur border-b border-gray-800">
            <h2 class="text-2xl font-bold">Saved Events</h2>
            <button onclick="hideSchedule()" class="text-gray-400 hover:text-white text-xl font-bold">Close ✕</button>
        </div>
        <div id="schedule-list" class="p-6 space-y-4 pb-24">
            <!-- List injected here via JS -->
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000/api";
        let sessionId = null;
        let deck = [];
        let isDragging = false;
        let startX = 0;
        let currentX = 0;

        // --- API Integrations ---

        async function startSession() {
            const input = document.getElementById('interests-input').value || "art, technology, society";
            const btn = document.querySelector('#start-screen button');
            btn.innerText = "Loading...";
            
            try {
                const res = await fetch(`${API_BASE}/session/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ interests: input })
                });
                const data = await res.json();
                sessionId = data.session_id;
                deck = data.deck;
                
                // UI Transitions
                document.getElementById('start-screen').style.opacity = '0';
                document.getElementById('start-screen').style.pointerEvents = 'none';
                document.getElementById('swipe-screen').style.opacity = '1';
                document.getElementById('swipe-screen').style.pointerEvents = 'auto';
                document.getElementById('nav-bar').style.opacity = '1';
                document.getElementById('nav-bar').style.pointerEvents = 'auto';
                
                renderDeck();
            } catch (err) {
                alert("Could not connect to backend. Is uvicorn running?");
                btn.innerText = "Start Swiping";
            }
        }

        async function postSwipe(cardId, direction) {
            try {
                const res = await fetch(`${API_BASE}/swipe`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, card_id: cardId, direction: direction })
                });
                const data = await res.json();
                deck = data.deck;
                renderDeck(); // Re-render silently replaces the DOM behind the scenes
            } catch (err) {
                console.error("Swipe API failed", err);
            }
        }

        async function showSchedule() {
            const res = await fetch(`${API_BASE}/session/${sessionId}/likes`);
            const likes = await res.json();
            
            const list = document.getElementById('schedule-list');
            list.innerHTML = likes.length === 0 
                ? "<p class='text-gray-500 text-center mt-10'>No events saved yet. Keep swiping!</p>" 
                : "";
                
            likes.forEach(event => {
                const imageName = event.category.replace(/\s+/g, '_') + '.jpg';
                list.innerHTML += `
                    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 flex gap-4">
                        <img src="Stock_Images/${imageName}" alt="${event.category}" class="w-16 h-16 object-cover rounded-lg shrink-0" onerror="this.style.display='none'">
                        <div>
                            <span class="text-xs text-pink-500 font-bold uppercase tracking-wider">${event.category}</span>
                            <h3 class="text-lg font-bold mb-1">${event.title}</h3>
                            <p class="text-sm text-gray-400 line-clamp-2">${event.description}</p>
                        </div>
                    </div>
                `;
            });
            
            document.getElementById('schedule-screen').classList.remove('translate-y-full');
        }

        function hideSchedule() {
            document.getElementById('schedule-screen').classList.add('translate-y-full');
        }

        // --- Deck Rendering & Physics ---

        function renderDeck() {
            const container = document.getElementById('deck-container');
            container.innerHTML = '';
            
            if (deck.length === 0) {
                container.innerHTML = `<div class="absolute inset-0 flex items-center justify-center text-gray-500">No more events to show.</div>`;
                return;
            }

            // Pool of mock amenities for the hackathon pitch
            const amenityPool = ['🚽 Restrooms', '🚰 Water', '🚋 Transit', '♿ Accessible', '☕ Cafe Nearby', '📶 Free WiFi'];

            // Render in reverse order so index 0 has the highest z-index (sits on top)
            [...deck].reverse().forEach((card, reversedIndex) => {
                const isTopCard = reversedIndex === deck.length - 1;
                const originalIndex = deck.length - 1 - reversedIndex;
                
                const cardDiv = document.createElement('div');
                cardDiv.className = `absolute inset-0 bg-white rounded-2xl shadow-2xl p-6 flex flex-col overflow-hidden border border-gray-200 text-gray-900 card-snap`;
                cardDiv.dataset.id = card.id;
                
                // Stacking visual offsets for cards underneath
                if (!isTopCard) {
                    const offset = originalIndex * 4;
                    const scale = 1 - (originalIndex * 0.04);
                    cardDiv.style.transform = `translateY(${offset}px) scale(${scale})`;
                    cardDiv.style.opacity = 1 - (originalIndex * 0.2);
                }

                // Generate 2 or 3 random tags for this card
                const shuffled = [...amenityPool].sort(() => 0.5 - Math.random());
                const selectedTags = shuffled.slice(0, Math.floor(Math.random() * 2) + 2);
                const tagsHtml = selectedTags.map(tag => 
                    `<span class="bg-gray-100 text-gray-600 text-[10px] font-bold px-2 py-1 rounded-md border border-gray-200 whitespace-nowrap">${tag}</span>`
                ).join('');

                // Format the image path based on the category name
                const imageName = card.category.replace(/\s+/g, '_') + '.avif';
                const imagePath = `Stock_Images/${imageName}`;

                // Inner HTML with Match Percentage badge, Stock Image, tags, and scrollable description
                cardDiv.innerHTML = `
                    <!-- Image Area (Fixed Height) -->
                    <div class="relative h-48 shrink-0 bg-gray-100 -mx-6 -mt-6 mb-3 flex items-center justify-center text-gray-300 overflow-hidden">
                        <!-- Match Percentage Badge -->
                        <div class="absolute top-4 right-4 bg-gray-900/90 backdrop-blur text-pink-400 font-bold px-3 py-1 rounded-full border border-pink-500/50 shadow-lg text-sm z-10">
                            ${card.match_percent ?? 0}% Match
                        </div>

                        <!-- Category Stock Image with a fallback color if the image is missing -->
                        <img src="${imagePath}" alt="${card.category}" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'absolute inset-0 bg-gradient-to-br from-indigo-500 to-purple-600\\'></div>';">
                    </div>

                    <!-- Amenities Bar -->
                    <div class="flex flex-wrap gap-2 mb-3 shrink-0">
                        ${tagsHtml}
                    </div>

                    <!-- Content Area (Flexible & Scrollable) -->
                    <div class="flex-1 flex flex-col min-h-0">
                        <span class="text-xs font-bold text-violet-600 uppercase tracking-wider mb-1 shrink-0">${card.category}</span>
                        <h2 class="text-xl font-black leading-tight mb-2 shrink-0">${card.title}</h2>
                        
                        <!-- Scrollable Description -->
                        <div class="desc-scroll overflow-y-auto flex-1 pr-2 pb-2 text-sm text-gray-600" style="overscroll-behavior: contain;">
                            ${card.description}
                        </div>
                    </div>
                `;

                // Only attach drag/touch swipe handlers to the top card
                if (isTopCard) attachGestures(cardDiv);
                container.appendChild(cardDiv);
            });
        }

        function triggerManualSwipe(direction) {
            const container = document.getElementById('deck-container');
            const topCard = container.lastElementChild; // Because we appended in reverse
            if (!topCard || !topCard.dataset.id) return;
            
            topCard.classList.add(direction === 'right' ? 'card-swipe-right' : 'card-swipe-left');
            postSwipe(topCard.dataset.id, direction);
        }

        function attachGestures(card) {
            card.style.cursor = 'grab';

            const onMove = (clientX) => {
                if (!isDragging) return;
                currentX = clientX;
                const deltaX = currentX - startX;
                const rotate = deltaX * 0.05;
                card.style.transform = `translateX(${deltaX}px) rotate(${rotate}deg)`;
                card.classList.remove('card-snap');
            };

            const onEnd = () => {
                if (!isDragging) return;
                isDragging = false;
                card.style.cursor = 'grab';
                card.classList.add('card-snap');
                
                const deltaX = currentX - startX;
                const threshold = window.innerWidth * 0.25;

                if (deltaX > threshold) {
                    card.classList.add('card-swipe-right');
                    postSwipe(card.dataset.id, 'right');
                } else if (deltaX < -threshold) {
                    card.classList.add('card-swipe-left');
                    postSwipe(card.dataset.id, 'left');
                } else {
                    card.style.transform = `translateX(0px) rotate(0deg)`;
                }
            };

            // Touch events
            card.addEventListener('touchstart', e => {
                isDragging = true;
                startX = e.touches[0].clientX;
                currentX = startX;
            }, {passive: true});
            card.addEventListener('touchmove', e => onMove(e.touches[0].clientX), {passive: true});
            card.addEventListener('touchend', onEnd);

            // Mouse events
            card.addEventListener('mousedown', e => {
                isDragging = true;
                startX = e.clientX;
                currentX = startX;
                card.style.cursor = 'grabbing';
            });
            window.addEventListener('mousemove', e => onMove(e.clientX));
            window.addEventListener('mouseup', onEnd);
        }
    </script>
</body>
</html>
